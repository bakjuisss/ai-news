<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="color-scheme" content="dark">
  <title>AI 뉴스 검색</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-2" aria-hidden="true"></div>

    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 6h16v2H4V6zm0 5h10v2H4v-2zm0 5h14v2H4v-2z" fill="currentColor" opacity="0.9"/>
              <circle cx="19" cy="7" r="2" fill="currentColor"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">AI 뉴스 검색</h1>
            <p class="brand-subtitle">최신 뉴스 검색 · 번역 · 핵심 요약 · 종합 보고서</p>
          </div>
        </div>

        <form id="search-form" class="search-form" role="search">
          <label for="search-input" class="visually-hidden">뉴스 검색</label>
          <input
            id="search-input"
            type="search"
            placeholder="검색어를 입력하세요 (예: AI 반도체 규제)"
            autocomplete="off"
            maxlength="200"
          >
          <button type="submit" id="search-btn">검색</button>
        </form>
      </div>
    </header>

    <main class="main">
      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="welcome" class="welcome">
        <h2>어떤 뉴스가 궁금하신가요?</h2>
        <p>키워드를 입력하면 AI가 최신 뉴스를 찾고, 영문 기사는 한국어로 번역한 뒤 핵심을 1~2줄로 요약해 드립니다.</p>
        <div class="suggestions">
          <button type="button" class="suggestion-chip" data-query="AI 반도체 규제">AI 반도체 규제</button>
          <button type="button" class="suggestion-chip" data-query="한국 경제 전망">한국 경제 전망</button>
          <button type="button" class="suggestion-chip" data-query="기후 변화 정책">기후 변화 정책</button>
        </div>
      </section>

      <section id="results-section" class="results-section hidden">
        <div class="results-header">
          <h2 id="results-title">검색 결과</h2>
          <button type="button" id="report-btn" class="report-btn">종합 보고서 생성</button>
        </div>
        <div id="articles" class="articles"></div>
      </section>

      <section id="report-section" class="report-section hidden">
        <div id="report-content" class="report-content"></div>
        <form id="email-form" class="email-form hidden">
          <p class="email-form-desc">받을 이메일과 해당 메일의 앱 비밀번호를 입력하세요. 입력한 주소로만 전송됩니다.</p>

          <label for="email-input">받을 이메일</label>
          <input
            id="email-input"
            type="email"
            placeholder="example@naver.com"
            autocomplete="email"
            maxlength="254"
            required
          >

          <label for="smtp-password-input">메일 앱 비밀번호</label>
          <input
            id="smtp-password-input"
            type="password"
            placeholder="네이버/Outlook/Gmail 앱 비밀번호"
            autocomplete="off"
            maxlength="128"
            required
          >

          <p id="email-preview" class="email-preview hidden"></p>

          <div class="email-form-actions">
            <button type="button" id="email-check-btn" class="email-check-btn">주소 확인</button>
            <button type="submit" id="email-btn" class="hidden" disabled>전송하기</button>
            <button type="button" id="download-report-btn" class="download-report-btn hidden">보고서 파일 저장</button>
          </div>
          <p class="email-form-note">네이버 메일이 안 오면 스팸함을 확인하거나, '보고서 파일 저장'을 이용해 주세요.</p>
        </form>
      </section>

      <aside id="sources-section" class="sources-section hidden">
        <h3>참고 출처</h3>
        <ul id="sources-list" class="sources-list"></ul>
        <div id="search-entry-point" class="search-entry-point"></div>
      </aside>
    </main>

    <footer class="footer">
      <p>AI가 생성한 요약 및 보고서는 참고용이며, 원문 기사를 반드시 확인하세요.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
