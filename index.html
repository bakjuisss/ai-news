<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 뉴스 검색</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">📰</span>
          <div>
            <h1 class="brand-title">AI 뉴스 검색</h1>
            <p class="brand-subtitle">최신 뉴스 검색 · 핵심 요약 · 종합 보고서</p>
          </div>
        </div>

        <form id="search-form" class="search-form" role="search">
          <label for="search-input" class="visually-hidden">뉴스 검색</label>
          <input
            id="search-input"
            type="search"
            placeholder="검색어를 입력하세요 (예: AI 반도체 규제)"
            autocomplete="off"
            maxlength="200"
          >
          <button type="submit" id="search-btn">검색</button>
        </form>
      </div>
    </header>

    <main class="main">
      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="welcome" class="welcome">
        <h2>어떤 뉴스가 궁금하신가요?</h2>
        <p>키워드를 입력하면 AI가 최신 뉴스를 찾고, 각 기사의 핵심을 1~2줄로 요약해 드립니다.</p>
        <div class="suggestions">
          <button type="button" class="suggestion-chip" data-query="AI 반도체 규제">AI 반도체 규제</button>
          <button type="button" class="suggestion-chip" data-query="한국 경제 전망">한국 경제 전망</button>
          <button type="button" class="suggestion-chip" data-query="기후 변화 정책">기후 변화 정책</button>
        </div>
      </section>

      <section id="results-section" class="results-section hidden">
        <div class="results-header">
          <h2 id="results-title">검색 결과</h2>
          <button type="button" id="report-btn" class="report-btn">종합 보고서 생성</button>
        </div>
        <div id="articles" class="articles"></div>
      </section>

      <section id="report-section" class="report-section hidden">
        <div id="report-content" class="report-content"></div>
      </section>

      <aside id="sources-section" class="sources-section hidden">
        <h3>참고 출처</h3>
        <ul id="sources-list" class="sources-list"></ul>
        <div id="search-entry-point" class="search-entry-point"></div>
      </aside>
    </main>

    <footer class="footer">
      <p>AI가 생성한 요약 및 보고서는 참고용이며, 원문 기사를 반드시 확인하세요.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
